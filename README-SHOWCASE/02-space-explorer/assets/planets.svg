<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Three worlds: LeetCode, digital_doppelganger, prep-zone">
<defs>
<radialGradient id="a" cx=".35" cy=".35"><stop offset="0" stop-color="#ffe2a8"/><stop offset="1" stop-color="#c58b3c"/></radialGradient>
<radialGradient id="b" cx=".35" cy=".35"><stop offset="0" stop-color="#7fd4ff"/><stop offset="1" stop-color="#1b4fa3"/></radialGradient>
<radialGradient id="c" cx=".35" cy=".35"><stop offset="0" stop-color="#c8f4f4"/><stop offset="1" stop-color="#4fa3b5"/></radialGradient>
<linearGradient id="sh" x1="0" x2="1" y1="0" y2="1"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></linearGradient>
</defs>
<style>.n{font:800 30px 'Helvetica Neue',Arial,sans-serif;letter-spacing:-1px}.m{font:400 12px 'Courier New',monospace;letter-spacing:3px}
.f1{animation:f 6s ease-in-out infinite}.f2{animation:f 7s ease-in-out infinite -2s}.f3{animation:f 8s ease-in-out infinite -4s}
@keyframes f{50%{transform:translateY(-10px)}}.r{animation:r 12s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1200" height="330" fill="#050816"/>
<line x1="0" y1="40" x2="1200" y2="40" stroke="#f3ead7" stroke-opacity=".13"/>
<text x="40" y="28" class="m" fill="#8a93b8">DESTINATIONS · 03 BODIES CHARTED</text>
<g class="f1"><g transform="translate(200 140)"><circle r="58" fill="url(#a)"/><circle r="58" fill="url(#sh)"/>
<g class="r"><circle cx="82" r="5" fill="#ddd"/></g></g></g>
<text x="200" y="250" text-anchor="middle" class="n" fill="#f3ead7">LeetCode</text>
<text x="200" y="276" text-anchor="middle" class="m" fill="#ff7a1a">C++ · 144 COMMITS</text>
<text x="200" y="298" text-anchor="middle" class="m" fill="#8a93b8">ARRAYS · DP · BINARY SEARCH</text>
<g class="f2"><g transform="translate(600 140)"><ellipse rx="112" ry="24" fill="none" stroke="#7fd4ff" stroke-opacity=".5" stroke-width="10"/><circle r="66" fill="url(#b)"/><circle r="66" fill="url(#sh)"/>
<path d="M-112 0 A112 24 0 0 0 112 0" fill="none" stroke="#7fd4ff" stroke-opacity=".8" stroke-width="10"/></g></g>
<text x="600" y="250" text-anchor="middle" class="n" fill="#f3ead7">digital_doppelganger</text>
<text x="600" y="276" text-anchor="middle" class="m" fill="#ff7a1a">NEXT.JS · FASTAPI · POSTGRES · DOCKER</text>
<text x="600" y="298" text-anchor="middle" class="m" fill="#8a93b8">HUMAN OR BOT? 4 DFAs DECIDE</text>
<g class="f3"><g transform="translate(1000 140)"><circle r="48" fill="url(#c)" opacity=".85"/><circle r="48" fill="url(#sh)"/>
<circle r="64" fill="none" stroke="#c8f4f4" stroke-opacity=".4" stroke-dasharray="3 7"/></g></g>
<text x="1000" y="250" text-anchor="middle" class="n" fill="#f3ead7">prep-zone</text>
<text x="1000" y="276" text-anchor="middle" class="m" fill="#ff7a1a">UNCHARTED</text>
<text x="1000" y="298" text-anchor="middle" class="m" fill="#8a93b8">SURVEY IN PROGRESS</text>
</svg>
