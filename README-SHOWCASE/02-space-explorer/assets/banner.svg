<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Space Explorer — mission log of Kush17narwal">
<defs>
<radialGradient id="sun"><stop offset="0" stop-color="#fff7e0"/><stop offset=".25" stop-color="#ffcf6b"/><stop offset=".5" stop-color="#ff7a1a" stop-opacity=".45"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
<radialGradient id="p1" cx=".35" cy=".35"><stop offset="0" stop-color="#7fd4ff"/><stop offset="1" stop-color="#1b4fa3"/></radialGradient>
<radialGradient id="p2" cx=".35" cy=".35"><stop offset="0" stop-color="#ff9a6b"/><stop offset="1" stop-color="#8f2d12"/></radialGradient>
<radialGradient id="p3" cx=".35" cy=".35"><stop offset="0" stop-color="#f7e3b4"/><stop offset="1" stop-color="#b38b4d"/></radialGradient>
<radialGradient id="neb" cx=".8" cy=".2" r=".7"><stop offset="0" stop-color="#3a1b5a" stop-opacity=".6"/><stop offset="1" stop-color="#050816" stop-opacity="0"/></radialGradient>
<linearGradient id="shoot" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
</defs>
<style>
.d{font:800 84px 'Helvetica Neue',Arial,sans-serif;letter-spacing:-3px}
.m{font:400 13px 'Courier New',monospace;letter-spacing:4px}
.tw{animation:tw 3s ease-in-out infinite}.tw2{animation:tw 4.5s ease-in-out infinite 1s}@keyframes tw{50%{opacity:.2}}
.o1{animation:spin 9s linear infinite}.o2{animation:spin 16s linear infinite}.o3{animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sh{animation:sh 7s ease-in infinite}@keyframes sh{0%{transform:translate(0,0);opacity:0}2%{opacity:1}12%{transform:translate(-520px,260px);opacity:0}100%{opacity:0}}
.pulse{animation:pu 3s ease-in-out infinite}@keyframes pu{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="440" fill="#050816"/><rect width="1200" height="440" fill="url(#neb)"/>
<g fill="#f3ead7">
<g class="tw"><circle cx="80" cy="60" r="1.4"/><circle cx="300" cy="380" r="1"/><circle cx="520" cy="40" r="1.6"/><circle cx="1150" cy="300" r="1.2"/><circle cx="980" cy="410" r="1"/><circle cx="640" cy="420" r="1.3"/></g>
<g class="tw2"><circle cx="200" cy="200" r="1"/><circle cx="420" cy="120" r="1.2"/><circle cx="1100" cy="60" r="1.5"/><circle cx="760" cy="30" r="1"/><circle cx="40" cy="330" r="1.3"/><circle cx="900" cy="200" r="1"/></g>
<g opacity=".5"><circle cx="150" cy="120" r=".8"/><circle cx="360" cy="260" r=".8"/><circle cx="700" cy="90" r=".8"/><circle cx="1040" cy="150" r=".8"/><circle cx="560" cy="300" r=".8"/><circle cx="260" cy="40" r=".8"/></g>
</g>
<g class="sh"><rect x="1100" y="20" width="140" height="2" fill="url(#shoot)" transform="rotate(-27 1100 20)"/></g>
<!-- solar system, tilted -->
<g transform="translate(880 230) scale(1 .42)">
<circle r="110" fill="none" stroke="#f3ead7" stroke-opacity=".15"/>
<circle r="175" fill="none" stroke="#f3ead7" stroke-opacity=".15"/>
<circle r="250" fill="none" stroke="#ff7a1a" stroke-opacity=".35" stroke-dasharray="4 6"/>
<g class="o1"><circle cx="110" r="16" fill="url(#p1)"/></g>
<g class="o2"><circle cx="-175" r="11" fill="url(#p2)"/></g>
<g class="o3"><circle cx="0" cy="250" r="22" fill="url(#p3)"/></g>
</g>
<circle cx="880" cy="230" r="120" fill="url(#sun)" class="pulse"/><circle cx="880" cy="230" r="26" fill="#fff3d6"/>
<!-- ship -->
<g><path d="M0 0 L-22 -10 L-15 0 L-22 10Z" fill="#f3ead7"/><path d="M-16 -3 L-30 0 L-16 3Z" fill="#ffcf6b"><animate attributeName="opacity" values="1;.3;1" dur=".3s" repeatCount="indefinite"/></path>
<animateMotion dur="14s" repeatCount="indefinite" rotate="auto" path="M640 360 C 760 420, 1120 380, 1130 250 S 900 60, 760 120 S 600 300, 640 360"/></g>
<text x="64" y="86" class="m" fill="#ff7a1a">— DEEP FIELD MISSION · VESSEL KUSH17NARWAL</text>
<text x="60" y="180" class="d" fill="#f3ead7">Space</text>
<text x="60" y="262" class="d" fill="none" stroke="#f3ead7" stroke-width="1.5">Explorer</text>
<text x="64" y="318" class="m" fill="#8a93b8">C++ · TYPESCRIPT · PYTHON · AUTOMATA THEORY</text>
<text x="64" y="384" class="m" fill="#f3ead7">MET 00:00:<tspan><animate attributeName="opacity" values="1;.4;1" dur="1s" repeatCount="indefinite"/>01</tspan>  ·  STATUS: IN ORBIT</text>
</svg>
