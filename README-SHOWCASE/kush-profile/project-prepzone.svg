<defs>
<filter id="g" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".38"/></pattern>
</defs>
<style>
text{font-family:'DejaVu Sans Mono','Menlo','Consolas','Courier New',monospace;white-space:pre}
.t{font-size:15px;fill:#ffb000}.d{font-size:15px;fill:#a86f00}.h{font-size:15px;fill:#fff0c9}.ok{fill:#c6ff6a}.er{fill:#ff5a3c}
.hd{font-size:12px;fill:#a86f00;font-weight:700}.s{font-size:13px;fill:#ffb000}.sd{font-size:13px;fill:#a86f00}
.big{font-size:30px;font-weight:700;fill:#fff0c9}.it{font-style:italic}
.r{opacity:0;animation:in .01s linear forwards}@keyframes in{to{opacity:1}}
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.fl{animation:fl .2s steps(2) infinite}@keyframes fl{50%{opacity:.96}}
.pulse{animation:pu 1.6s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}
