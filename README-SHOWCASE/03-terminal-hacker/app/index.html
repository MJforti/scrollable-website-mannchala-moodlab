<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Terminal Hacker — root@kush17narwal</title>
<meta name="description" content="A tiling hacker terminal with a working shell, boot sequence, live diagnostics and code rain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--fg:#ffb000;--dim:#a86f00;--faint:#4a3100;--bg:#0b0700;--hi:#fff0c9;--err:#ff5a3c;--ok:#c6ff6a}
:root.green{--fg:#33ff66;--dim:#1f9e40;--faint:#0c3a18;--bg:#020b04;--hi:#d8ffe2}
:root.ice{--fg:#7fe9ff;--dim:#3c8ea3;--faint:#0f3540;--bg:#01080b;--hi:#e6fbff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000}
body{font:14px/1.5 "IBM Plex Mono",ui-monospace,monospace;color:var(--fg);overflow:hidden}
.crt{position:fixed;inset:0;background:var(--bg);display:grid;grid-template-columns:1fr 360px;grid-template-rows:1fr 1fr 24px;gap:1px;padding:10px;
  text-shadow:0 0 6px color-mix(in srgb,var(--fg) 60%,transparent);animation:on .9s ease-out}
@keyframes on{0%{transform:scale(1,.003);filter:brightness(4)}40%{transform:scale(1,.003)}70%{transform:scale(1,1);filter:brightness(2)}100%{filter:none}}
.crt::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,#0000 0 2px,#0000004d 2px 4px),radial-gradient(ellipse at center,transparent 60%,#000 120%);z-index:5}
.crt::before{content:"";position:fixed;inset:0;pointer-events:none;background:var(--fg);opacity:.02;animation:flick .12s infinite;z-index:5}
@keyframes flick{50%{opacity:.035}}
.pane{border:1px solid var(--faint);position:relative;overflow:hidden;min-height:0}
.pane>h2{position:absolute;top:-1px;left:12px;font-size:11px;font-weight:600;background:var(--bg);padding:0 6px;color:var(--dim);letter-spacing:.1em;z-index:2}
.pane.active{border-color:var(--dim)}
.pane.active>h2{color:var(--fg)}
#term{grid-row:1/3;padding:18px 16px 12px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--faint) transparent;cursor:text}
#out{white-space:pre-wrap;word-break:break-word}
.line{display:flex;flex-wrap:wrap}
.ps{color:var(--hi)}
.ps i{font-style:normal;color:var(--fg)}
#in{background:none;border:0;outline:0;color:transparent;caret-color:transparent;font:inherit;position:absolute;left:-9999px}
.typed{white-space:pre}
.cur{display:inline-block;width:.6em;background:var(--fg);animation:blink 1s steps(1) infinite;color:var(--bg)}
@keyframes blink{50%{opacity:0}}
.hi{color:var(--hi)}.err{color:var(--err)}.ok{color:var(--ok)}.dim{color:var(--dim)}
.bar{display:inline-block;color:var(--fg)}
#mon{padding:20px 14px 10px;font-size:12px;line-height:1.55}
#mon .row{display:flex;justify-content:space-between;gap:8px}
#mon .meter{letter-spacing:-1px;white-space:pre}
#spark{display:block;width:100%;height:56px;margin-top:6px}
#rainPane canvas{width:100%;height:100%;display:block}
.status{grid-column:1/3;display:flex;font-size:12px;line-height:24px;background:var(--fg);color:var(--bg);text-shadow:none;padding-right:10px}
.status span{padding:0 10px}.status .s0{background:var(--hi);font-weight:600}.status .grow{flex:1}
.status a{color:inherit}
@media (max-width:860px){.crt{grid-template-columns:1fr;grid-template-rows:1fr 150px 24px}#term{grid-row:1}#mon{display:none}.status{grid-column:1}.status .opt{display:none}}
@media (prefers-reduced-motion:reduce){.crt,.crt::before,.cur{animation:none}}
</style>
</head>
<body>
<div class="crt" id="crt">
  <section class="pane active" id="term" aria-label="Interactive terminal"><h2>[0] zsh — root@kush17narwal</h2>
    <div id="out" role="log" aria-live="polite"></div>
    <div class="line" id="prompt" hidden><span class="ps" id="ps"></span>&nbsp;<span class="typed" id="typed"></span><span class="cur">&nbsp;</span></div>
    <input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input">
  </section>
  <section class="pane" id="mon"><h2>[1] sysmon</h2><div id="monBody"></div><canvas id="spark"></canvas></section>
  <section class="pane" id="rainPane"><h2>[2] rain.sh</h2><canvas id="rain"></canvas></section>
  <div class="status"><span class="s0">KUSH17NARWAL</span><span>0:zsh*</span><span class="opt">1:sysmon</span><span class="opt">2:rain</span><span class="grow"></span><span class="opt"><a href="https://github.com/Kush17narwal">github</a></span><span id="clock"></span></div>
</div>
<script>
(()=>{
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id), out=$('out'), input=$('in'), typed=$('typed'), term=$('term');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let cwd='~', busy=true, hist=[], hi=-1;
const FS={'~':['projects/','secrets/','about.txt','README.txt','.plan'],'~/projects':['LeetCode/','digital_doppelganger/','prep-zone/'],'~/secrets':['launch_codes.enc','do_not_open.txt']};
const FILES={
 'about.txt':'Kush17narwal — competitive programmer &amp; full-stack builder.\n\n  LeetCode/              C++ solutions, 144 commits, grouped by topic\n  digital_doppelganger/  human-or-bot detection with 4 DFAs (Next.js + FastAPI)\n  prep-zone/             coming soon\n\ngithub: <a href="https://github.com/Kush17narwal" style="color:inherit">github.com/Kush17narwal</a>',
 'README.txt':'You found the terminal. Type <span class="hi">help</span> to see what it can do.\nEverything here runs in your browser. Nothing is actually hacked.',
 '.plan':'1. build things that feel alive\n2. ship them\n3. repeat',
 'do_not_open.txt':'You opened it anyway. Respect.\n\n  ┌──────────────────────┐\n  │  curiosity: 100/100  │\n  └──────────────────────┘',
 'launch_codes.enc':'<span class="err">ERR: file is encrypted. try `decrypt launch_codes.enc`</span>'
};
function print(html='',cls=''){const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=html;out.appendChild(d);term.scrollTop=term.scrollHeight;return d}
const sleep=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,30):ms));
async function typeOut(text,cls='',speed=12){const d=print('',cls);for(let i=0;i<text.length;i++){d.textContent+=text[i];if(i%2===0){term.scrollTop=term.scrollHeight;await sleep(speed)}}return d}
async function progress(label,ms=900){const d=print('');const n=24;for(let i=0;i<=n;i++){d.innerHTML=`${esc(label.padEnd(28,'.'))} [${'█'.repeat(i)}${'░'.repeat(n-i)}] ${String(Math.round(i/n*100)).padStart(3)}%`;await sleep(ms/n)}d.innerHTML+=' <span class="ok">OK</span>'}
function ps(){return `<i>root@kush17narwal</i>:<span class="hi">${cwd}</span>#`}
function showPrompt(){$('ps').innerHTML=ps();$('prompt').hidden=false;busy=false;typed.textContent='';input.value='';input.focus();term.scrollTop=term.scrollHeight}

async function boot(){
  const lines=['KUSH BIOS v17.0  (c) 2026 Kush17narwal','CPU0: QUANTUM-X 64-core @ 6.66GHz','Memory test: '];
  for(const l of lines.slice(0,2)) {print(esc(l),'dim');await sleep(140)}
  const m=print('Memory test: 0K','dim');for(let k=0;k<=65536;k+=4096){m.textContent=`Memory test: ${k}K`;await sleep(18)}m.textContent+=' OK';
  await sleep(200);
  for(const mod of ['kernel.cpp','dsa.leetcode','automata.dfa[4]','stack.nextjs+fastapi','fun.module']) await progress('loading '+mod,RM?40:380);
  await sleep(200);
  print(`<span class="hi">
 ██╗  ██╗██╗   ██╗███████╗██╗  ██╗
 ██║ ██╔╝██║   ██║██╔════╝██║  ██║
 █████╔╝ ██║   ██║███████╗███████║
 ██╔═██╗ ██║   ██║╚════██║██╔══██║
 ██║  ██╗╚██████╔╝███████║██║  ██║
 ╚═╝  ╚═╝ ╚═════╝ ╚══════╝╚═╝  ╚═╝</span>`);
  await typeOut('Welcome back, Kush. Last login: '+new Date(Date.now()-864e5*3).toUTCString()+' from 10.0.0.1');
  print('Try <span class="hi">cat about.txt</span> · <span class="hi">help</span> for commands · <span class="hi">Tab</span> completes · <span class="hi">↑↓</span> history','dim');
  showPrompt();
}

const CMDS={
 help:()=>print(`<span class="hi">AVAILABLE COMMANDS</span>
  help            this list            neofetch      system summary
  ls [dir]        list files           cat &lt;file&gt;    read a file
  cd &lt;dir&gt;        change directory     whoami        identify yourself
  scan            sweep the network    hack &lt;target&gt; "hack" something
  decrypt &lt;file&gt;  crack a file         diag          run diagnostics
  matrix          full-screen rain     theme &lt;name&gt;  amber | green | ice
  echo &lt;text&gt;     print text           date          current time
  history         past commands        clear         wipe screen
  sudo &lt;cmd&gt;      try your luck        exit          power down`),
 whoami:()=>print('kush17narwal <span class="dim">· C++ · TypeScript · Python · automata</span>'),
 date:()=>print(new Date().toString()),
 echo:a=>print(esc(a.join(' '))),
 clear:()=>{out.innerHTML=''},
 history:()=>print(hist.map((h,i)=>`${String(i+1).padStart(4)}  ${esc(h)}`).join('\n')),
 ls:a=>{const d=a[0]?(a[0].startsWith('~')?a[0]:cwd+'/'+a[0]).replace(/\/$/,''):cwd;const f=FS[d];
   if(!f)return print(`<span class="err">ls: cannot access '${esc(a[0])}': No such file or directory</span>`);
   print(f.map(n=>n.endsWith('/')?`<span class="hi">${n}</span>`:n).join('    '))},
 cd:a=>{const t=(a[0]||'~').replace(/\/$/,'');const n=t==='..'?'~':t.startsWith('~')?t:(cwd+'/'+t);if(FS[n])cwd=n;else print(`<span class="err">cd: no such directory: ${esc(t)}</span>`)},
 cat:a=>{const f=(a[0]||'').split('/').pop();if(FILES[f])print(FILES[f]);else print(`<span class="err">cat: ${esc(a[0]||'')}: No such file</span>`)},
 neofetch:()=>print(`<span class="hi">      .--.     </span>  <span class="hi">kush17narwal</span>@<span class="hi">github</span>
<span class="hi">     |o_o |    </span>  ----------------
<span class="hi">     |:_/ |    </span>  OS: Competitive Programmer x86_64
<span class="hi">    //   \\ \\   </span>  Kernel: C++ (LeetCode)
<span class="hi">   (|     | )  </span>  Uptime: ${Math.floor(performance.now()/60000)} mins
<span class="hi">  /'\\_   _/\`\\  </span>  Stack: Next.js · FastAPI · PostgreSQL
<span class="hi">  \\___)=(___/  </span>  CPU: QUANTUM-X (64) @ 6.66GHz
                  Memory: ${(mem*640|0)}MiB / 65536MiB
                  Theme: ${theme}  ${['█','█','█'].map((b,i)=>`<span style="opacity:${1-i*.3}">${b}${b}${b}</span>`).join('')}`),
 theme:a=>{const t=a[0];if(!['amber','green','ice'].includes(t))return print('usage: theme amber|green|ice');document.documentElement.className=t==='amber'?'':t;theme=t;print(`theme set to <span class="hi">${t}</span>`)},
 sudo:a=>{if(a[0]==='rm')return print('<span class="err">nice try.</span> the filesystem is made of JavaScript and good intentions.');print(`[sudo] password for root: <span class="dim">********</span>\n<span class="err">root is not in the sudoers file. This incident will be reported.</span>\n<span class="dim">(to yourself. you are root.)</span>`)},
 exit:async()=>{await typeOut('powering down...');document.getElementById('crt').style.animation='on .6s reverse forwards';await sleep(900);location.reload()},
 scan:async()=>{print('Starting sweep of 10.0.0.0/24 ...','dim');for(let i=0;i<8;i++){await sleep(220);const ip=`10.0.0.${(Math.random()*254|0)+1}`;
   const port=[22,80,443,1337,3000,8080][Math.random()*6|0];print(`  ${ip.padEnd(14)} port ${String(port).padEnd(5)} ${Math.random()<.3?'<span class="err">OPEN</span>':'<span class="ok">filtered</span>'}  ${['nginx','ssh','arcade-srv','toaster','smart-fridge','printer'][Math.random()*6|0]}`)}
   print('sweep complete. 1 toaster found. it seems friendly.','hi')},
 hack:async a=>{const t=a.join(' ')||'mainframe';print(`target acquired: <span class="hi">${esc(t)}</span>`);
   for(const s of ['bypassing firewall','injecting payload','escalating privileges','decrypting session']) await progress(s,500);
   const d=print('');for(let i=0;i<14;i++){d.textContent=Array.from({length:6},()=>Math.random().toString(16).slice(2,10)).join(' ');await sleep(50)}
   print(`\n<span class="ok">ACCESS GRANTED</span> — ${esc(t)} says hello 👋\n<span class="dim">(this was theatre. please don't hack things.)</span>`);flash()},
 decrypt:async a=>{if(!/launch_codes/.test(a[0]||''))return print('usage: decrypt launch_codes.enc');const d=print('');const target='THE LAUNCH CODE IS: 0000 · (it always was)';
   for(let i=0;i<=target.length;i++){for(let k=0;k<3;k++){d.innerHTML=`<span class="ok">${esc(target.slice(0,i))}</span>${Array.from({length:target.length-i},()=>String.fromCharCode(33+Math.random()*90)).join('').replace(/[<>&]/g,'#')}`;await sleep(14)}}},
 diag:async()=>{print('<span class="hi">RUNNING DIAGNOSTICS</span>');const tests=[['cpu.thermals','42°C'],['mem.integrity','0 errors'],['disk.smart','healthy'],['net.latency','12ms'],['coffee.level','<span class="err">LOW</span>'],['vibes','immaculate']];
   for(const [k,v] of tests){await sleep(260);print(`  ${k.padEnd(18,'.')} ${v}`)}print('all systems nominal (except coffee).','ok')},
 matrix:()=>{rainFull=!rainFull;$('rainPane').style.cssText=rainFull?'position:fixed;inset:0;z-index:4;background:var(--bg)':'';resizeRain();print(rainFull?'rain unleashed. type <span class="hi">matrix</span> again to contain it.':'rain contained.')}
};
let theme='amber';
const NAMES=Object.keys(CMDS);
async function run(line){
  print(`${ps()} ${esc(line)}`);$('prompt').hidden=true;busy=true;
  if(line.trim()){hist.push(line);hi=hist.length}
  const [c,...a]=line.trim().split(/\s+/);
  if(!c){}else if(CMDS[c]){try{await CMDS[c](a)}catch(e){print('<span class="err">segfault (core dumped)</span>')}}
  else print(`<span class="err">zsh: command not found: ${esc(c)}</span>${suggest(c)}`);
  showPrompt();
}
function suggest(c){const m=NAMES.find(n=>n.startsWith(c[0])&&Math.abs(n.length-c.length)<3);return m?`\n<span class="dim">did you mean <span class="hi">${m}</span>?</span>`:''}
function flash(){const c=$('crt');c.animate([{filter:'brightness(3) hue-rotate(40deg)'},{filter:'none'}],{duration:500})}
input.addEventListener('input',()=>{typed.textContent=input.value});
input.addEventListener('keydown',e=>{
  if(busy){e.preventDefault();return}
  if(e.key==='Enter'){e.preventDefault();run(input.value)}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0){hi--;input.value=hist[hi];typed.textContent=input.value}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(hi<hist.length-1){hi++;input.value=hist[hi]}else{hi=hist.length;input.value=''}typed.textContent=input.value}
  else if(e.key==='Tab'){e.preventDefault();const parts=input.value.split(' ');const last=parts.pop();
    const pool=parts.length?[...(FS[cwd]||[]),...Object.keys(FILES)]:NAMES;const m=pool.filter(n=>n.startsWith(last));
    if(m.length===1){parts.push(m[0]);input.value=parts.join(' ')+(parts.length===1?' ':'');typed.textContent=input.value}else if(m.length>1)print(m.join('  '),'dim')}
  else if(e.key==='l'&&e.ctrlKey){e.preventDefault();out.innerHTML=''}
  else if(e.key==='c'&&e.ctrlKey){e.preventDefault();print(`${ps()} ${esc(input.value)}^C`);input.value='';typed.textContent=''}
});
addEventListener('pointerup',()=>{if(!getSelection().toString())input.focus({preventScroll:true})});

/* --- sysmon --- */
let mem=.4,cpu=new Array(8).fill(.3),net=[],t0=performance.now();
const spark=$('spark'),sc=spark.getContext('2d');
const meter=(v,n=16)=>'▕'+'█'.repeat(Math.round(v*n)).padEnd(n,'·')+'▏';
function mon(){
  cpu=cpu.map(v=>Math.max(.02,Math.min(1,v+(Math.random()-.5)*.25)));mem=Math.max(.2,Math.min(.95,mem+(Math.random()-.5)*.04));
  net.push(Math.random()**2);if(net.length>60)net.shift();
  const up=((performance.now()-t0)/1000|0);
  $('monBody').innerHTML=`<div class="row"><span class="hi">HOST</span><span>kush17narwal · 64c</span></div>
<div class="row"><span class="hi">UPTIME</span><span>${String(up/3600|0).padStart(2,'0')}:${String((up/60|0)%60).padStart(2,'0')}:${String(up%60).padStart(2,'0')}</span></div><br>`+
  cpu.map((v,i)=>`<div class="row"><span>cpu${i}</span><span class="meter">${meter(v)}</span><span>${String(Math.round(v*100)).padStart(3)}%</span></div>`).join('')+
  `<br><div class="row"><span>mem</span><span class="meter">${meter(mem)}</span><span>${Math.round(mem*64)}G</span></div>
<div class="row"><span>tmp</span><span>${(38+cpu[0]*30).toFixed(1)}°C</span><span class="dim">fan ${(1200+cpu[1]*2400)|0}rpm</span></div>
<div class="row"><span>net ↓↑</span><span>${(net.at(-1)*940).toFixed(0)} Mb/s</span></div>`;
  const w=spark.width=spark.clientWidth*2,h=spark.height=112;sc.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--fg');sc.lineWidth=2;
  sc.beginPath();net.forEach((v,i)=>{const x=i/59*w,y=h-v*h*.9-4;i?sc.lineTo(x,y):sc.moveTo(x,y)});sc.stroke();
  sc.globalAlpha=.15;sc.lineTo(w,h);sc.lineTo(0,h);sc.fillStyle=sc.strokeStyle;sc.fill();sc.globalAlpha=1;
  $('clock').textContent=new Date().toLocaleTimeString([], {hour12:false});
}
setInterval(mon,RM?2000:700);mon();

/* --- rain --- */
const rc=$('rain'),rx=rc.getContext('2d');let cols=[],rw,rh,rainFull=false,FS_=14;
const GLY='アカサタナハマヤラワ0123456789ABCDEF<>/\\{}[]#$%&*+=';
function resizeRain(){const r=rc.parentElement.getBoundingClientRect();rw=rc.width=r.width;rh=rc.height=r.height;cols=Array.from({length:Math.ceil(rw/FS_)},()=>Math.random()*-rh/FS_)}
addEventListener('resize',resizeRain);resizeRain();
let lr=0;
function rain(t){requestAnimationFrame(rain);if(t-lr<(RM?400:50))return;lr=t;
  const fg=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim(),bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  rx.fillStyle=bg+'cc';rx.globalAlpha=.25;rx.fillRect(0,0,rw,rh);rx.globalAlpha=1;rx.font=FS_+'px "IBM Plex Mono"';
  cols.forEach((y,i)=>{const ch=GLY[Math.random()*GLY.length|0];rx.fillStyle=Math.random()<.05?'#fff':fg;rx.fillText(ch,i*FS_,y*FS_);
    cols[i]=y*FS_>rh&&Math.random()>.97?0:y+1})}
requestAnimationFrame(rain);
boot();
})();
</script>
</body>
</html>
