<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="KUSH ARCADE — insert coin">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ff2bd6" stroke-opacity=".18"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".35"/></pattern>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07020f"/><stop offset="1" stop-color="#2a0845"/></linearGradient>
</defs>
<style>
.t{font:900 92px 'Courier New',monospace;letter-spacing:8px}
.s{font:700 18px 'Courier New',monospace;letter-spacing:6px}
.blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.flick{animation:f 5s infinite}@keyframes f{0%,90%,100%{opacity:1}91%{opacity:.2}92%{opacity:1}95%{opacity:.4}96%{opacity:1}}
.floor{animation:fl 1.6s linear infinite}@keyframes fl{to{transform:translateY(40px)}}
.border{animation:bc 3s steps(1) infinite}@keyframes bc{50%{stroke:#19f6ff}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="380" fill="url(#sky)"/>
<g transform="translate(0 250)"><g class="floor"><rect y="-40" width="1200" height="200" fill="url(#grid)"/></g></g>
<rect x="0" y="250" width="1200" height="2" fill="#ff2bd6" filter="url(#glow)"/>
<rect x="14" y="14" width="1172" height="352" rx="16" fill="none" stroke="#ff2bd6" stroke-width="3" class="border" filter="url(#glow)"/>
<text x="600" y="62" text-anchor="middle" class="s" fill="#ffb627">★ PLAYER ONE: KUSH17NARWAL ★</text>
<g filter="url(#glow)" text-anchor="middle">
<text x="600" y="160" class="t" fill="#fff" stroke="#ff2bd6" stroke-width="2">KUSH<tspan fill="#19f6ff" stroke="#19f6ff" class="flick"> ARCADE</tspan></text>
</g>
<text x="600" y="200" text-anchor="middle" class="s" fill="#b6ff2b">C++ · DSA · FULL-STACK · AUTOMATA</text>
<!-- pixel snake -->
<g filter="url(#glow)">
<g fill="#b6ff2b"><rect width="18" height="18" x="-9" y="-9"/>
<animateMotion dur="6s" repeatCount="indefinite" path="M120 300 H1080 V330 H120 Z"/></g>
<g fill="#7dff2b" opacity=".85"><rect width="16" height="16" x="-8" y="-8"/><animateMotion dur="6s" begin="-.15s" repeatCount="indefinite" path="M120 300 H1080 V330 H120 Z"/></g>
<g fill="#3dff8c" opacity=".7"><rect width="14" height="14" x="-7" y="-7"/><animateMotion dur="6s" begin="-.3s" repeatCount="indefinite" path="M120 300 H1080 V330 H120 Z"/></g>
<g fill="#19f6ff" opacity=".55"><rect width="12" height="12" x="-6" y="-6"/><animateMotion dur="6s" begin="-.45s" repeatCount="indefinite" path="M120 300 H1080 V330 H120 Z"/></g>
<rect x="590" y="306" width="18" height="18" fill="#ff3b3b"><animate attributeName="opacity" values="1;.3;1" dur=".8s" repeatCount="indefinite"/></rect>
</g>
<text x="600" y="276" text-anchor="middle" class="s blink" fill="#19f6ff">INSERT COIN · PRESS START</text>
<text x="60" y="62" class="s" fill="#fff">1UP 000144</text>
<text x="1140" y="62" text-anchor="end" class="s" fill="#ffb627">HI 999999</text>
<rect width="1200" height="380" fill="url(#scan)"/>
</svg>
